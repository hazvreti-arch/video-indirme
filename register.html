<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidora — Kayıt</title><link rel="stylesheet" href="/assets/app.css"></head><body><div style="max-width:430px;margin:12vh auto;padding:18px"><div class="workspace-card" style="padding:22px"><div class="brand"><div class="brand-mark">V</div><div><b>Vidora</b><span>Studio</span></div></div><h2>Vidora hesabı oluştur</h2><form id="f"><input class="mini-input" id="email" type="email" placeholder="E-posta" required style="margin-bottom:8px"><input class="mini-input" id="password" type="password" placeholder="En az 8 karakter" required style="margin-bottom:12px"><button class="primary-btn" style="width:100%">Hesap oluştur</button></form><p id="err" style="color:#ff7085;font-size:10px"></p><p style="font-size:10px;color:#777">Zaten hesabın var mı? <a href="/login" style="color:#a99dff">Giriş yap</a></p></div></div><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){err.textContent=d.error;return}location.href=d.redirect||'/'};</script></body></html>
