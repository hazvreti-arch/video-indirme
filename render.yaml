services:
  - type: web
    name: vidora-downloader
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      mkdir -p /opt/render/project/src/.deno &&
      DENO_INSTALL=/opt/render/project/src/.deno sh -c "curl -fsSL https://deno.land/install.sh | sh" &&
      rm -rf /opt/render/project/src/.bgutil-ytdlp-pot-provider &&
      git clone --depth 1 --branch 2.0.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /opt/render/project/src/.bgutil-ytdlp-pot-provider &&
      cd /opt/render/project/src/.bgutil-ytdlp-pot-provider/server &&
      /opt/render/project/src/.deno/bin/deno install --allow-scripts=npm:canvas --frozen
    startCommand: >-
      export PATH="/opt/render/project/src/.deno/bin:$PATH" &&
      gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 1800
    envVars:
      - key: VIDORA_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JOB_RETENTION_HOURS
        value: "2"
      - key: MAX_BATCH_ITEMS
        value: "50"
