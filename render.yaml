services:
  - type: web
    name: vidora-downloader
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 1800
    envVars:
      - key: VIDORA_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JOB_RETENTION_HOURS
        value: "2"
      - key: MAX_BATCH_ITEMS
        value: "50"
