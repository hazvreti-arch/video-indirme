<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vidora Admin</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="app-shell"><main class="main" style="margin-left:0;width:100%"><header class="topbar"><div class="crumb">Vidora / <b>Admin</b></div><a href="/" class="ghost-btn">Workspace</a></header><div class="view active"><div class="view-head"><div><span>ADMIN</span><h2>Operations dashboard</h2></div><button class="primary-btn" id="diag">Run diagnostics</button></div><div class="hero-metrics" id="stats"></div><div class="settings-card" style="margin-top:12px"><h3>Diagnostics</h3><pre id="diagOut" style="white-space:pre-wrap;color:#8c95a6;font-size:10px"></pre></div><div class="settings-card" style="margin-top:12px"><h3>Recent jobs</h3><div id="jobs"></div></div><div class="settings-card" style="margin-top:12px"><h3>Ban IP</h3><div class="convert-controls"><input class="mini-input" id="ip" placeholder="IP"><input class="mini-input" id="reason" placeholder="Reason"><button class="primary-btn" id="ban">Ban</button></div></div></div></main></div><script>(async()=>{const get=async u=>(await fetch(u)).json();async function load(){const s=await get('/api/admin/stats');stats.innerHTML=Object.entries(s).map(([k,v])=>`<div style="padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)"><b>${v}</b><span>${k}</span></div>`).join('');const j=await get('/api/admin/jobs');jobs.innerHTML=j.map(x=>`<div class="queue-row"><div><h4>${x.title||x.id}</h4><p>${x.status} · ${x.progress}% · ${x.platform||''} · ${x.ip||''}</p></div></div>`).join('')};await load();diag.onclick=async()=>{const d=await (await fetch('/api/admin/diagnostics',{method:'POST'})).json();diagOut.textContent=JSON.stringify(d,null,2)};ban.onclick=async()=>{await fetch('/api/admin/ban',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip:ip.value,reason:reason.value})});toast?.('Banned');await load()}})()</script></body></html>
